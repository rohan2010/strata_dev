[project]
name = "conductor"
version = "0.1.0"
description = "Multi-agent orchestration system — generalist orchestrator + specialist subagents"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.2",
    "langchain-openai>=1.4.1",
    "langchain-google-genai>=4.3.1",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
conductor = "conductor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conductor"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's whole API is `= typer.Option(...)` in defaults; B008 is a false positive here.
"src/conductor/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
