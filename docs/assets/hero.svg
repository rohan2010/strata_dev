<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Conductor — a multi-agent orchestrator: a goal is planned, dispatched in parallel to specialist subagents, and aggregated into a pull request.">
  <title>Conductor — plan, delegate, aggregate</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#131a24"/>
      <stop offset="100%" stop-color="#0b1622"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee7c7"/>
      <stop offset="45%" stop-color="#6ea8fe"/>
      <stop offset="100%" stop-color="#c792ea"/>
    </linearGradient>

    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d3b4d"/>
      <stop offset="100%" stop-color="#3b5068"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Typing reveal for the tagline -->
    <clipPath id="typeClip">
      <rect x="56" y="118" width="0" height="34">
        <animate attributeName="width" values="0;700" dur="2.4s" begin="0.6s" fill="freeze"
                 calcMode="spline" keySplines="0.22 0.61 0.36 1" keyTimes="0;1"/>
      </rect>
    </clipPath>

    <!-- Node shape reused for every stage -->
    <g id="dot">
      <circle r="5" fill="#7ee7c7"/>
      <circle r="9" fill="#7ee7c7" opacity="0.28"/>
    </g>
  </defs>

  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="429" rx="18" fill="none" stroke="#243040" stroke-width="1"/>

  <!-- ── wordmark ─────────────────────────────────────────────── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="82" font-size="58" font-weight="700" fill="url(#wordmark)" letter-spacing="-1.5">
      conductor
      <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
    </text>

    <!-- typed tagline + cursor -->
    <text x="56" y="144" font-size="21" fill="#8ba3bf" clip-path="url(#typeClip)">
      one generalist orchestrator, many specialist subagents
    </text>
    <rect y="122" width="10" height="26" fill="#7ee7c7">
      <animate attributeName="x" values="56;752" dur="2.4s" begin="0.6s" fill="freeze"
               calcMode="spline" keySplines="0.22 0.61 0.36 1" keyTimes="0;1"/>
      <animate attributeName="opacity" values="1;1;0;1" dur="1s" begin="3s" repeatCount="indefinite"/>
    </rect>

    <!-- provider chips -->
    <g font-size="13" fill="#8ba3bf">
      <g transform="translate(760,58)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.4s" fill="freeze"/>
        <rect width="92" height="28" rx="14" fill="#16202c" stroke="#2b3a4c"/>
        <text x="46" y="19" font-size="12" fill="#8ba3bf" text-anchor="middle">anthropic</text>
      </g>
      <g transform="translate(862,58)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.6s" fill="freeze"/>
        <rect width="72" height="28" rx="14" fill="#16202c" stroke="#2b3a4c"/>
        <text x="36" y="19" font-size="12" fill="#8ba3bf" text-anchor="middle">openai</text>
      </g>
      <g transform="translate(944,58)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.8s" fill="freeze"/>
        <rect width="72" height="28" rx="14" fill="#16202c" stroke="#2b3a4c"/>
        <text x="36" y="19" font-size="12" fill="#8ba3bf" text-anchor="middle">gemini</text>
      </g>
      <g transform="translate(1026,58)" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2s" fill="freeze"/>
        <rect width="72" height="28" rx="14" fill="#16202c" stroke="#2b3a4c"/>
        <text x="36" y="19" font-size="12" fill="#8ba3bf" text-anchor="middle">ollama</text>
      </g>
    </g>
  </g>

  <!-- ── pipeline ─────────────────────────────────────────────── -->
  <g id="pipeline" transform="translate(0,26)">

    <!-- wires -->
    <g fill="none" stroke="url(#wire)" stroke-width="2">
      <path id="w1" d="M 172 240 L 268 240"/>
      <path id="w2" d="M 392 240 C 440 240 440 186 488 186"/>
      <path id="w3" d="M 392 240 C 440 240 440 294 488 294"/>
      <path id="w4" d="M 632 186 C 680 186 680 240 728 240"/>
      <path id="w5" d="M 632 294 C 680 294 680 240 728 240"/>
      <path id="w6" d="M 852 240 L 948 240"/>
    </g>

    <!-- travelling packets: staggered so the fork reads as parallel -->
    <g>
      <use href="#dot" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="2.6s;pipe.end+0.6s" fill="remove"/>
        <animateMotion dur="1.1s" begin="2.6s;pipe.end+0.6s" rotate="auto">
          <mpath href="#w1"/>
        </animateMotion>
      </use>

      <use href="#dot" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="3.7s;pipe.end+1.7s" fill="remove"/>
        <animateMotion dur="1.2s" begin="3.7s;pipe.end+1.7s"><mpath href="#w2"/></animateMotion>
      </use>
      <use href="#dot" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="3.7s;pipe.end+1.7s" fill="remove"/>
        <animateMotion dur="1.2s" begin="3.7s;pipe.end+1.7s"><mpath href="#w3"/></animateMotion>
      </use>

      <use href="#dot" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="5.4s;pipe.end+3.4s" fill="remove"/>
        <animateMotion dur="1.2s" begin="5.4s;pipe.end+3.4s"><mpath href="#w4"/></animateMotion>
      </use>
      <use href="#dot" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" dur="1.2s" begin="5.4s;pipe.end+3.4s" fill="remove"/>
        <animateMotion dur="1.2s" begin="5.4s;pipe.end+3.4s"><mpath href="#w5"/></animateMotion>
      </use>

      <use href="#dot" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" dur="1.1s" begin="6.8s;pipe.end+4.8s" fill="remove"/>
        <animateMotion id="pipe" dur="1.1s" begin="6.8s;pipe.end+4.8s"><mpath href="#w6"/></animateMotion>
      </use>
    </g>

    <!-- stages -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">

      <g transform="translate(52,212)">
        <rect width="120" height="56" rx="12" fill="#16202c" stroke="#33455a"/>
        <text x="60" y="26" font-size="13" fill="#e6edf3">goal</text>
        <text x="60" y="42" font-size="10" fill="#6b829c">plain language</text>
      </g>

      <g transform="translate(268,212)">
        <rect width="124" height="56" rx="12" fill="#16202c" stroke="#3f6ea8">
          <animate attributeName="stroke" values="#3f6ea8;#6ea8fe;#3f6ea8" dur="2.2s" begin="2.6s" repeatCount="indefinite"/>
        </rect>
        <text x="62" y="26" font-size="13" fill="#e6edf3">planner</text>
        <text x="62" y="42" font-size="10" fill="#6b829c">typed task graph</text>
      </g>

      <g transform="translate(488,158)">
        <rect width="144" height="56" rx="12" fill="#16202c" stroke="#2f6f5c"/>
        <text x="72" y="26" font-size="13" fill="#e6edf3">implementer</text>
        <text x="72" y="42" font-size="10" fill="#6b829c">write scope</text>
      </g>

      <g transform="translate(488,266)">
        <rect width="144" height="56" rx="12" fill="#16202c" stroke="#6b5a86"/>
        <text x="72" y="26" font-size="13" fill="#e6edf3">reviewer</text>
        <text x="72" y="42" font-size="10" fill="#6b829c">read only</text>
      </g>

      <g transform="translate(728,212)">
        <rect width="124" height="56" rx="12" fill="#16202c" stroke="#33455a"/>
        <text x="62" y="26" font-size="13" fill="#e6edf3">aggregate</text>
        <text x="62" y="42" font-size="10" fill="#6b829c">partial-safe</text>
      </g>

      <g transform="translate(948,212)">
        <rect width="120" height="56" rx="12" fill="#16202c" stroke="#2f6f5c"/>
        <text x="60" y="26" font-size="13" fill="#7ee7c7">pull request</text>
        <text x="60" y="42" font-size="10" fill="#6b829c">you merge</text>
      </g>
    </g>

    <!-- parallel-layer bracket -->
    <g stroke="#2b3a4c" stroke-width="1" fill="none" stroke-dasharray="3 4">
      <rect x="474" y="144" width="172" height="192" rx="12"/>
    </g>
    <text x="560" y="352" font-size="10.5" text-anchor="middle" fill="#5d7690"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      one dependency layer — dispatched in parallel
    </text>
  </g>

  <!-- audit ticker -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#4a5f78">
    <text x="56" y="412" fill="#4a5f78">
      every delegation, tool call, and token logged write-ahead
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2.2s" fill="freeze"/>
    </text>
  </g>
</svg>
